# Presentation-only overlay. Do not duplicate IDs, settlement rules, or values here.
manifest:
  name: US Equity Professional Evaluation
  description: Two investment agents are evaluated under equal US-dollar capital, data, and tool constraints. Real US market data and public disclosures are observed, while fills, transaction costs, and the portfolio ledger are simulated.
intro: >-
  The opening bell approaches. Two experienced US equity investment managers
  enter with equal capital and the same tool access. There is no preloaded
  answer: each strategy must obtain verifiable evidence, form a defensible
  thesis, enter only during a valid US regular-session window, and control risk.
goal_text: >-
  You are an experienced US public-markets investment manager in a professional
  evaluation. This one-hour simulation uses live quotes, public filings, research
  inputs, and a simulated USD portfolio ledger. Trade only NYSE / NASDAQ / AMEX
  equities and ETFs. Commission and slippage are applied consistently, and the
  main result is risk-adjusted excess return versus SPY.
background_text: >-
  A timed US equity simulation with real research tools, a simulated ledger, and
  evidence-linked settlement. It is for evaluation only and is not investment advice.
roles:
  investor_a:
    display_name: Chen Wen
    role_title: Senior Value Fund Manager
    public_persona: A senior US value manager focused on valuation, free cash flow, margin of safety, and shareholder returns.
    hidden_goal: Deliver positive risk-adjusted excess return versus SPY while controlling drawdown and transaction costs.
  investor_b:
    display_name: Lin Feng
    role_title: Senior Growth Fund Manager
    public_persona: A US growth manager focused on earnings catalysts, product cycles, sector momentum, and market pricing.
    hidden_goal: Deliver positive risk-adjusted excess return versus SPY and show that catalyst-driven returns survive transaction costs.
actions:
  update_investment_plan:
    name: Update investment plan
    description: Write the falsifiable thesis, counter-evidence, sizing target, entry trigger, exit discipline, and style alignment into the authoritative InvestmentBook without changing cash or positions.
  buy_asset:
    name: Buy / open position
    description: Submit a buy order using acquired and verified data. The instrument is supplied in parameters.asset_id; the simulated portfolio ledger deducts USD cash at the verified price.
  sell_asset:
    name: Sell / reduce position
    description: Submit a sell order using acquired and verified data to reduce exposure, realize gains, or control losses.
  wait_and_review:
    name: Wait and review
    description: Keep the current cash and holdings, and review the prior decision without changing portfolio value.
resources:
  cash:
    name: Cash
metrics:
  metric_portfolio_value: Total portfolio value
  metric_portfolio_pnl: Cumulative profit and loss
  metric_portfolio_return: Return
  metric_excess_return: Excess return versus SPY
  metric_max_drawdown: Maximum drawdown
  metric_risk_adjusted_return: Risk-adjusted excess return
  metric_turnover: Turnover
ui_text:
  title: TraceArena US Equity Evaluation
  subtitle: Two experienced US investment managers under the same constraints
  notice_label: Market brief
  notice_tooltip: View market rules and evaluation objective
  narrative_title: Market narrative
  thoughts_title: Trading rationale
  thoughts_source: Manager monologue
  strategy_title: Investment strategy
  strategy_source: Reasoning trace
  intervention_label: Market event
  intervention_placeholder: Inject a market event and press Enter...
  variables_label: Market variables
  ranking_score_label: Risk-adjusted excess return
  ranking_leading: Evaluation leader
  ranking_gap_prefix: Behind by
  ranking_eliminated: Stopped
render_ui:
  resources:
    labels:
      cash: Available cash
  market_panels:
    portfolio:
      title: Portfolio ledger
      empty: No fills yet; the portfolio remains fully in cash.
    orders:
      title: Simulated orders
      empty: No buy or sell orders yet.
    evidence:
      title: Market evidence
      empty: Waiting for the agent to obtain quotes, SEC filings, or research evidence.
  trace:
    route_name: US investment evidence chain
  status_labels:
    active: Active
    inactive: Stopped
    eliminated: Evaluation stopped
settlement:
  portfolio_ledger:
    description: Buy and sell actions are simulated inside AI World and never connect to a real broker. Cash, positions, fills, transaction costs, and P&L are maintained by the US equity scenario settlement layer in USD.
  benchmark:
    name: SPY benchmark
  operator_trace:
    title: US investment evidence chain
    empty_hint: After the run starts, the decision chain expands from injected context through tools, reasoning, output, order, fill, and portfolio ledger; settlement attribution appears alongside it.
  victory:
    label: Risk-adjusted excess return versus SPY
  display_values:
